tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: name_he
            field:
              input_type: text
              antlers: false
              type: text
              display: 'Hebrew Name'
              width: 33
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
              validate:
                - required
          -
            handle: name_la
            field:
              type: text
              width: 33
              validate:
                - required
              display: 'Latin Name'
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              input_type: text
              antlers: false
              hide_display: false
          -
            handle: name_hu
            field:
              input_type: text
              antlers: false
              type: text
              display: 'Hungarian Name'
              width: 33
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
          -
            handle: content
            field:
              type: markdown
              localizable: true
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - 'max:200'
              display: Slug
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              from: name_la
              generate: true
              show_regenerate: true
              hide_display: false
          -
            handle: category
            field:
              options:
                bird: Bird
                flower: Flower
              taggable: false
              push_tags: false
              multiple: false
              clearable: false
              searchable: true
              cast_booleans: false
              type: select
              display: Category
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
title: Family
