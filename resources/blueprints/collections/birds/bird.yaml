tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: name_he
            field:
              input_type: text
              antlers: false
              type: text
              display: 'Hebrew Name'
              width: 50
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
              validate:
                - required
          -
            handle: name_la
            field:
              type: text
              width: 50
              validate:
                - required
              display: 'Latin Name'
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              input_type: text
              antlers: false
              hide_display: false
          -
            handle: name_hu
            field:
              input_type: text
              antlers: false
              type: text
              display: 'Hungarian Name'
              width: 50
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
          -
            handle: name_en
            field:
              input_type: text
              antlers: false
              type: text
              display: 'English Name'
              width: 50
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
          -
            handle: genera
            field:
              type: terms
              taxonomies:
                - genera
              display: Genera
              mode: select
              width: 33
          -
            handle: families
            field:
              type: terms
              taxonomies:
                - families
              display: Families
              mode: select
              width: 33
          -
            handle: orders
            field:
              type: terms
              taxonomies:
                - orders
              display: Orders
              mode: select
              width: 33
          -
            handle: more_info_link
            field:
              input_type: text
              antlers: false
              type: text
              display: 'More info link'
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
          -
            handle: content
            field:
              type: markdown
              localizable: true
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
              display: Slug
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              from: name_la
              generate: true
              show_regenerate: true
              hide_display: false
          -
            handle: hero_image
            field:
              max_files: 1
              mode: grid
              container: assets
              folder: birds
              restrict: true
              allow_uploads: true
              show_filename: true
              show_set_alt: true
              type: assets
              display: 'Hero Image'
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
          -
            handle: parent
            field:
              type: entries
              collections:
                - birds
              max_items: 1
              listable: false
              localizable: true
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              mode: single
              inline: false
              full_width: false
              columns: 1
              rows: 1
              time_enabled: true
              time_seconds_enabled: false
              hide_display: false
title: Bird
