<div class="max-w-5xl mx-auto mb-32">

    <article class="max-w-6xl mx-auto px-3">
        <header class="mx-auto max-w-xl text-center content">
            <h1 class="mb-4">פרחים</h1>
        </header>
        {{ collection:flowers as="posts" paginate="12" sort="date:desc" }}
    
            <div class="mx-auto text-center"> 
                {{ paginate }}

                {{ partial:pagination }}
            
                {{ /paginate }}
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 py-8">
                {{ posts }}
                    <div class="col-span-1">
                        {{ partial:flowers/card }}
                    </div>
                {{ /posts }}
            </div>
            <div class="mx-auto text-center"> 
                {{ paginate }}
    
                {{ partial:pagination }}
            
                {{ /paginate }}
            </div>
        {{ /collection:flowers }}
    </article>

</div>
